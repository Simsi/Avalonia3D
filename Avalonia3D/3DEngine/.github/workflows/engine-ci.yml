name: Avalonia3D Engine CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.os }} build gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.414
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Build gate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Configuration Release
      - name: Build gate (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./build.sh Release
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}-${{ runner.arch }}
          path: Artifacts
          if-no-files-found: warn

  browser-contract:
    name: net8.0-browser contract
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.414
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Restore
        run: dotnet restore Avalonia3D.Engine.sln -p:RestorePackagesWithLockFile=true
      - name: Build browser target
        run: dotnet build Avalonia3D.Engine.csproj -c Release -f net8.0-browser --no-restore
      - name: Validate baseline and WebGL runtime
        run: |
          node eng/validate-package-architecture.mjs
          node eng/validate-baseline.mjs
          node --check WebGL/mini3d.webgl.js
          node eng/webgl-runtime.mjs
